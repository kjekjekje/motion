<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>아시안미션 모션그래픽</title>
<meta name="description" content="아시안미션(AM) 30초 홍보 모션그래픽 · 9:16 · Swiss Grid">
<style>
html,body{margin:0;height:100%;background:#1a1a1a;font-family:"Malgun Gothic",Arial,sans-serif;overflow:hidden}
#wrap{position:relative;height:100dvh;aspect-ratio:9/16;max-width:100vw;margin:0 auto}
@media (max-aspect-ratio:9/16){#wrap{width:100vw;height:auto;top:50%;transform:translateY(-50%)}}
canvas{width:100%;height:100%;display:block;background:#F4F2EE}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(17,17,17,.55);cursor:pointer;border:0;width:100%;color:#fff}
#ov .pl{width:96px;height:96px;border-radius:50%;background:#E4002B;display:flex;align-items:center;justify-content:center}
#ov .pl:after{content:"";border-left:30px solid #fff;border-top:18px solid transparent;border-bottom:18px solid transparent;margin-left:8px}
#ov span{font-size:18px;font-weight:700;letter-spacing:.02em}
#ov small{font-size:13px;opacity:.75}
#ov.hide{display:none}
#dl{position:absolute;right:12px;bottom:12px;color:#fff;background:rgba(17,17,17,.7);padding:8px 12px;font-size:13px;text-decoration:none;display:none}
#ov:not(.hide)~#dl{display:block}
</style></head>
<body><div id="wrap"><canvas id="c" width="1080" height="1920"></canvas>
<button id="ov" aria-label="재생"><div class="pl"></div><span id="ol">재생하기</span><small>소리가 함께 재생됩니다 · 30초</small></button>
<a id="dl" href="AsianMission_30s_9x16.mp4" download>MP4 다운로드</a></div>
<script>
const W=1080,H=1920,c=document.getElementById('c'),x=c.getContext('2d');
const RED='#E4002B',INK='#111111',BG='#F4F2EE',GRID='rgba(17,17,17,0.07)';
const M=72,COLS=6,GW=(W-2*M),CW=GW/COLS; // 6-col grid
const KR='"Malgun Gothic"',EN='"Arial Black", Arial, sans-serif',ENR='Arial, Helvetica, sans-serif';
const T=30;
const SC=[[0,4.2],[4.2,8.6],[8.6,15.4],[15.4,21.0],[21.0,24.4],[24.4,30]];
const VO=[0.4,4.4,8.8,15.6,21.2,24.8];
const ease=t=>t<0?0:t>1?1:1-Math.pow(1-t,4);
const eio=t=>t<0?0:t>1?1:t<.5?8*t*t*t*t:1-Math.pow(-2*t+2,4)/2;
function p(t,a,d){return ease((t-a)/d)}
function txt(s,X,Y,font,col,al){x.font=font;x.fillStyle=col;x.textAlign=al||'left';x.textBaseline='alphabetic';x.fillText(s,X,Y)}
// masked reveal: text slides up from a clip line
function rev(s,X,Y,size,font,col,t,a,al,lh){const k=p(t,a,.7);if(k<=0)return;x.save();x.beginPath();x.rect(0,Y-size*1.05,W,size*1.3);x.clip();txt(s,X,Y+(1-k)*size*1.2,font,col,al);x.restore()}
function hl(X,Y,w,t,a,col,th){const k=p(t,a,.8);x.fillStyle=col||INK;x.fillRect(X,Y,w*k,th||4)}
function vl(X,Y,h,t,a,col,th){const k=p(t,a,.8);x.fillStyle=col||INK;x.fillRect(X,Y,th||4,h*k)}
function grid(t){x.fillStyle=BG;x.fillRect(0,0,W,H);x.fillStyle=GRID;for(let i=0;i<=COLS;i++)x.fillRect(M+i*CW-1,0,2,H);for(let j=1;j<16;j++)x.fillRect(0,j*120-1,W,2);
 // persistent header/footer
 x.fillStyle=INK;x.fillRect(M,M,GW,6);
 txt('ASIAN MISSION',M,M+54,'700 30px '+ENR,INK);
 txt('AM / MEMBER CARE',W-M,M+54,'400 30px '+ENR,INK,'right');
 const sc=SC.findIndex(s=>t>=s[0]&&t<s[1]);
 txt(String((sc<0?5:sc)+1).padStart(2,'0')+' / 06',M,H-M,'700 30px '+ENR,INK);
 txt('amcareland.com',W-M,H-M,'400 30px '+ENR,INK,'right');
 x.fillStyle=INK;x.fillRect(M,H-M-58,GW,2);x.fillStyle=RED;x.fillRect(M,H-M-60,GW*(t/T),6);
}
function wipe(t,s,e){ // red block transition at scene end
 const d=.45;if(t>e-d&&t<e){const k=eio((t-(e-d))/d);x.fillStyle=RED;x.fillRect(0,H*(1-k),W,H*k)}
 if(t>=s&&t<s+d&&s>0){const k=eio((t-s)/d);x.fillStyle=RED;x.fillRect(0,0,W,H*(1-k))}
}
function num(v,k){return Math.round(v*k).toLocaleString('en-US')}
const scenes=[
 (t)=>{ // 0 title
  x.fillStyle=RED;const k=p(t,.2,.9);x.fillRect(M,300,CW*2*k,CW*2*k>0?CW*2:0);
  rev('AM',M+22,300+CW*2-40,150,'900 150px '+EN,BG,t,.6);
  rev('아시안',M,1010,190,'700 190px '+KR,INK,t,.9);
  rev('미션',M,1220,190,'700 190px '+KR,INK,t,1.05);
  hl(M,1300,GW,t,1.3,INK,4);
  rev('선교사의 든든한 동반자',M,1390,58,'400 58px '+KR,INK,t,1.6);
  rev('Asian Mission — Missionary Support',M,1460,34,'400 34px '+ENR,'#555',t,1.8);
  vl(M+CW*4,300,CW*2,t,.5,INK,4);
  rev('EST.',M+CW*4+30,350,30,'700 30px '+ENR,INK,t,1.0);
  rev('Care',M+CW*4+30,420,52,'700 52px '+ENR,INK,t,1.1);
  rev('for those',M+CW*4+30,480,52,'700 52px '+ENR,INK,t,1.2);
  rev('who go.',M+CW*4+30,540,52,'700 52px '+ENR,RED,t,1.3);
 },
 (t)=>{ // 1 100%
  t-=SC[1][0];
  rev('01 — 투명한 전달',M,330,40,'700 40px '+KR,RED,t,.2);
  hl(M,360,GW,t,.1);
  const k=p(t,.4,1.6);
  rev(Math.round(100*k)+'',M-10,860,440,'900 440px '+EN,INK,t,.3);
  rev('%',M+CW*4.7,860,200,'900 200px '+EN,RED,t,.5);
  hl(M,920,GW,t,.8,INK,4);
  rev('후원금의 100%를',M,1080,92,'700 92px '+KR,INK,t,1.0);
  rev('선교사와 사역지에',M,1200,92,'700 92px '+KR,INK,t,1.15);
  rev('그대로 전달합니다.',M,1320,92,'700 92px '+KR,RED,t,1.3);
  x.fillStyle=INK;const b=p(t,1.6,.6);for(let i=0;i<6;i++){x.fillRect(M+i*CW+8,1450,(CW-16)*b,(i<6?1:0)*24)}
 },
 (t)=>{ // 2 numbers
  t-=SC[2][0];
  rev('02 — 2025 IMPACT',M,330,40,'700 40px '+ENR,RED,t,.2);
  hl(M,360,GW,t,.1);
  rev('선교사 재정협력',M,470,48,'700 48px '+KR,INK,t,.4);
  rev(num(3063,p(t,.5,2.0)),M-6,760,300,'900 300px '+EN,INK,t,.5);
  rev('명의 선교사와 협력',M,850,48,'400 48px '+KR,'#444',t,.9);
  hl(M,930,GW,t,2.4,INK,4);
  x.fillStyle=RED;const k=p(t,2.6,.8);x.fillRect(M,970,GW,700*k);
  if(k>.6){rev('총 지원액',M+40,1080,48,'700 48px '+KR,BG,t,2.9);
  rev(Math.round(85*p(t,3.0,1.6))+'',M+30,1430,360,'900 360px '+EN,BG,t,3.0);
  rev('억원',M+CW*3.8,1430,150,'700 150px '+KR,BG,t,3.2);
  rev('국내외 선교사역 · 특별후원',M+40,1580,44,'400 44px '+KR,BG,t,3.5);}
 },
 (t)=>{ // 3 three cards
  t-=SC[3][0];
  rev('03 — 쉼과 회복',M,330,40,'700 40px '+KR,RED,t,.2);
  hl(M,360,GW,t,.1);
  const items=[['315','가정','선교사 힐링 바우처','쉼과 회복의 시간'],['395','가정','선교관 지원','편안한 쉼의 공간'],['814','명','건강검진 지원','건강한 사역을 위해']];
  items.forEach((it,i)=>{const a=.4+i*.9,Y=440+i*400;
   hl(M,Y,GW,t,a,INK,4);
   rev('0'+(i+1),M,Y+80,40,'700 40px '+ENR,RED,t,a+.1);
   rev(num(+it[0],p(t,a+.1,1.2)),M+CW,Y+250,230,'900 230px '+EN,i==1?RED:INK,t,a+.1);
   rev(it[1],M+CW*4.3,Y+250,70,'700 70px '+KR,INK,t,a+.3);
   rev(it[2],M+CW,Y+330,46,'700 46px '+KR,INK,t,a+.4);
   rev(it[3],W-M,Y+330,40,'400 40px '+KR,'#555',t,a+.5,'right');
  });
  hl(M,1640,GW,t,3.0,INK,4);
 },
 (t)=>{ // 4 member care
  t-=SC[4][0];
  x.fillStyle=INK;const k=p(t,0,.6);x.fillRect(0,0,W,H*k);
  if(k<.5)return;
  x.fillStyle=GRID.replace('17,17,17','255,255,255');for(let i=0;i<=COLS;i++)x.fillRect(M+i*CW-1,0,2,H);
  rev('04 — MEMBER CARE',M,330,40,'700 40px '+ENR,RED,t,.3);
  hl(M,360,GW,t,.3,BG);
  rev('MEMBER',M-6,640,165,'900 165px '+EN,BG,t,.4);
  rev('CARE',M-6,860,165,'900 165px '+EN,RED,t,.55);
  hl(M,960,GW,t,.8,BG);
  rev('국내 사역자',M,1110,72,'700 72px '+KR,BG,t,1.0);
  rev('해외 사역자',M+CW*3,1110,72,'700 72px '+KR,BG,t,1.15);
  vl(M+CW*3-30,1020,140,t,1.0,BG,3);
  rev('모든 사역자를 위한 돌봄',M,1300,64,'400 64px '+KR,BG,t,1.4);
 },
 (t)=>{ // 5 end
  t-=SC[5][0];
  rev('복음의 씨앗,',M,560,120,'700 120px '+KR,INK,t,.3);
  rev('AM이 함께',M,720,120,'700 120px '+KR,INK,t,.5);
  rev('심습니다.',M,880,120,'700 120px '+KR,RED,t,.7);
  hl(M,960,GW,t,1.1,INK,4);
  x.fillStyle=RED;const k=p(t,1.5,.8);x.fillRect(M,1050,CW*2,CW*2*k);
  if(k>.5)rev('AM',M+22,1050+CW*2-40,150,'900 150px '+EN,BG,t,1.7);
  rev('아시안미션',M+CW*2+40,1140,70,'700 70px '+KR,INK,t,1.9);
  rev('선교사 후원 · 선교지 후원',M+CW*2+40,1210,40,'400 40px '+KR,'#444',t,2.0);
  rev('amcareland.com',M+CW*2+40,1350,52,'700 52px '+ENR,RED,t,2.2);
 }
];
function draw(t){grid(t);const i=SC.findIndex(s=>t>=s[0]&&t<s[1]);if(i>=0){scenes[i](t);wipe(t,SC[i][0],SC[i][1])}else scenes[5](t)}
draw(0);
// ---- audio ----
function bgm(t0){ // calm minimal piano-ish pulse, 96 bpm
 const g=ac.createGain();g.gain.value=.0001;g.connect(dest);g.connect(ac.destination);
 g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.32,t0+1.5);g.gain.setValueAtTime(.32,t0+27.5);g.gain.exponentialRampToValueAtTime(.0001,t0+30);
 const beat=60/96;const chords=[[57,60,64,69],[53,57,60,65],[48,52,55,60],[55,59,62,67]];
 const f=n=>440*Math.pow(2,(n-69)/12);
 const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2600;lp.connect(g);
 for(let b=0;b*beat<30;b++){const t=t0+b*beat,ch=chords[Math.floor(b/8)%4];
  // pad on bar start
  if(b%8==0)ch.forEach(n=>{const o=ac.createOscillator(),e=ac.createGain();o.type='triangle';o.frequency.value=f(n-12);e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(.05,t+.8);e.gain.linearRampToValueAtTime(0,t+beat*8+.3);o.connect(e).connect(lp);o.start(t);o.stop(t+beat*8+.4)});
  // pluck arpeggio 8ths
  for(let h=0;h<2;h++){const tt=t+h*beat/2,n=ch[(b*2+h)%4]+12;const o=ac.createOscillator(),e=ac.createGain();o.type='sine';o.frequency.value=f(n);e.gain.setValueAtTime(.0001,tt);e.gain.exponentialRampToValueAtTime(.09,tt+.01);e.gain.exponentialRampToValueAtTime(.0001,tt+.6);o.connect(e).connect(lp);o.start(tt);o.stop(tt+.7)}
  // soft kick on beats 1,3 after intro
  if(b>=8&&b%2==0){const o=ac.createOscillator(),e=ac.createGain();o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(40,t+.15);e.gain.setValueAtTime(.35,t);e.gain.exponentialRampToValueAtTime(.0001,t+.3);o.connect(e).connect(g);o.start(t);o.stop(t+.32)}
  // bass
  if(b%4==0){const o=ac.createOscillator(),e=ac.createGain();o.type='sine';o.frequency.value=f(ch[0]-24);e.gain.setValueAtTime(.0001,t);e.gain.exponentialRampToValueAtTime(.18,t+.03);e.gain.exponentialRampToValueAtTime(.0001,t+beat*3.8);o.connect(e).connect(g);o.start(t);o.stop(t+beat*4)}
 }
}
let ac,dest,vos,running=false;
async function load(u){const r=await fetch(u);if(!r.ok)throw 0;return ac.decodeAudioData(await r.arrayBuffer())}
const ov=document.getElementById('ov'),ol=document.getElementById('ol');
ov.onclick=async()=>{
 if(running)return;running=true;ol.textContent='불러오는 중…';
 try{
 if(!ac){ac=new AudioContext();dest=ac.createGain();
  vos=await Promise.all([0,1,2,3,4,5].map(i=>load('am_build/vo'+i+'.mp3').catch(()=>load('am_build/vo'+i+'.wav'))));
  const lead=.35,min=[3.6,4.0,5.6,5.0,3.2,4.6];let gap=.55;
  const need=()=>vos.reduce((s,b,i)=>s+Math.max(min[i],lead+b.duration+gap),0);
  while(need()>T&&gap>.1)gap-=.05;
  let s0=0;for(let i=0;i<6;i++){const len=i==5?T-s0:Math.max(min[i],lead+vos[i].duration+gap);SC[i]=[s0,s0+len];VO[i]=s0+lead;s0+=len}
 }
 }catch(e){running=false;ac=null;ol.textContent='음성을 불러오지 못했어요 · 다시 누르기';return}
 await ac.resume();
 const vg=ac.createGain();vg.gain.value=1.6;vg.connect(ac.destination);
 const t0=ac.currentTime+.2;
 bgm(t0);vos.forEach((b,i)=>{const s=ac.createBufferSource();s.buffer=b;s.connect(vg);s.start(t0+VO[i])});
 ov.classList.add('hide');
 const loop=()=>{const t=ac.currentTime-t0;draw(Math.max(0,Math.min(t,T-0.001)));
  if(t<T+0.1)requestAnimationFrame(loop);else{running=false;ol.textContent='다시 보기';ov.classList.remove('hide')}};loop();
};
</script></body></html>
